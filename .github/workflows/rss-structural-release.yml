name: RSS structural refactor CI and release
on:
  push:
    branches: [main, refactor/rss-architecture-20261020]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Structural checks
        run: |
          test -f app/src/main/java/com/example/muyinteresanteNoTocar/RssPullParser.java
          grep -q 'XmlPullParser' app/src/main/java/com/example/muyinteresanteNoTocar/RssPullParser.java
          ! grep -q 'DocumentBuilderFactory' app/src/main/java/com/example/muyinteresanteNoTocar/DescargaNoticiasRSS.java
          ! grep -q 'configChanges=' app/src/main/AndroidManifest.xml
          ! grep -q 'onConfigurationChanged' app/src/main/java/com/example/muyinteresante/MainActivity.java
          grep -q 'ViewModelProvider' app/src/main/java/com/example/muyinteresante/MainActivity.java
          grep -q 'Executors.newSingleThreadExecutor' app/src/main/java/com/example/muyinteresante/util/NewsCacheManager.java
          ! grep -q 'NewsCacheManager.loadNewsFromCache' app/src/main/java/com/example/muyinteresante/MainActivity.java
      - name: Unit tests and release build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Publish verified release on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/.*versionName "([^"]+)".*/\1/p' app/build.gradle | head -1)
          test "$version" = "1.12.1"
          cat > release-notes.md <<'EOF'
          - 🌐 Tras un fallo ambiguo RSS, la clasificación consulta HTTP(S), sin confundir DNS/TCP con una respuesta web.
          - ⚙️ Limita a dos los diagnósticos simultáneos y comparte ocho hilos de sondeo; reduce la creación de hilos y sockets.
          - 📡 Conserva la observación pasiva y las descargas RSS directas sin prechecks HTTP redundantes.
          - 🔍 El diagnóstico manual mantiene las sondas multicapa DNS, TCP, NTP, HTTP y TLS.
          - 🔐 Este APK usa signingConfigs.debug: podría no actualizar instalaciones firmadas con otra clave.
          EOF
          gh release create "v$version" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$version — Diagnóstico HTTP y concurrencia de red" \
            --notes-file release-notes.md
