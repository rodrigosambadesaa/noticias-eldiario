name: Bootstrap Android news app

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          path: target

      - name: Checkout working news-reader template
        uses: actions/checkout@v4
        with:
          repository: rodrigosambadesaa/practica-noticias-web-muy-interesante
          ref: 34d67599d2c8d518f034bb97e3a09a6e2d7d6a8e
          path: template

      - name: Verify RSS feed
        shell: bash
        run: |
          python3 - <<'PY' > feed.env
          import urllib.request
          candidates = ["https://www.eldiario.es/rss/"]
          headers = {"User-Agent":"Mozilla/5.0 NoticiasAndroid/1.0", "Accept":"application/rss+xml,application/xml,text/xml,*/*"}
          for url in candidates:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read(8192).lower()
                      if any(x in data for x in (b"<rss", b"<channel", b"<rdf:rdf", b"<feed")):
                          print("FEED_URL=" + r.geturl())
                          raise SystemExit(0)
              except Exception as e:
                  print(f"# {url}: {e}")
          raise SystemExit("No working RSS feed found")
          PY
          cat feed.env
          grep '^FEED_URL=' feed.env >> "$GITHUB_ENV"

      - name: Build project from template
        shell: bash
        env:
          APP_NAME: "Noticias elDiario.es"
          APP_ID: "com.rodrigosambade.noticias.eldiario"
          REPO_NAME: "noticias-eldiario"
          MEDIA_NAME: "elDiario.es"
          GIST_REV: "ce7bd07ed17d10d48785a0c21527c8100ea6da7e"
        run: |
          rsync -a --exclude='.git' --exclude='.github' template/ target/
          mkdir -p target/third_party/connectivity

          GIST_RAW="https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/${GIST_REV}/ConnectivityAndInternetAccess.java"
          curl --retry 3 --retry-all-errors -fsSL "$GIST_RAW" -o target/third_party/connectivity/ConnectivityAndInternetAccess.java
          cp target/third_party/connectivity/ConnectivityAndInternetAccess.java target/app/src/main/java/com/example/muyinteresante/util/ConnectivityAndInternetAccess.java
          sed -i 's/^package net\.i2p\.android\.router\.util;/package com.example.muyinteresante.util;/' target/app/src/main/java/com/example/muyinteresante/util/ConnectivityAndInternetAccess.java

          python3 - <<'PY'
          import os, re, pathlib
          root = pathlib.Path('target')
          app_name = os.environ['APP_NAME']
          app_id = os.environ['APP_ID']
          feed = os.environ['FEED_URL']
          repo = os.environ['REPO_NAME']

          p = root/'app/build.gradle'
          s = p.read_text()
          s = re.sub(r'applicationId\s+"[^"]+"', f'applicationId "{app_id}"', s)
          s = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 16', s)
          s = re.sub(r'versionCode\s+\d+', 'versionCode 1', s)
          s = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.0.0"', s)
          p.write_text(s)

          p = root/'app/src/main/res/values/strings.xml'
          s = p.read_text().replace('Noticias Muy Interesante', app_name).replace('Muy Interesante', app_name)
          p.write_text(s)

          p = root/'app/src/main/res/layout/activity_main.xml'
          s = p.read_text().replace('android:text="Muy Interesante"', f'android:text="{app_name}"')
          p.write_text(s)

          p = root/'app/src/main/java/com/example/muyinteresante/MainActivity.java'
          s = p.read_text()
          s = re.sub(r'private static final String RSS_URL = "[^"]+";', f'private static final String RSS_URL = "{feed}";', s)
          s = re.sub(r'private static final String RSS_PAGE_URL = "[^"]+";', f'private static final String RSS_PAGE_URL = "{feed}";', s)
          s = s.replace('private boolean hasMoreNews = true;', 'private boolean hasMoreNews = false;')
          s = s.replace('hasMoreNews = true;', 'hasMoreNews = false;')
          p.write_text(s)

          p = root/'app/src/main/java/com/example/muyinteresanteNoTocar/DescargaNoticiasRSS.java'
          s = p.read_text().replace('practica-noticias-web-muy-interesante/1.0', repo + '/1.0')
          p.write_text(s)
          PY

          cat > target/third_party/connectivity/README.md <<EOF
          # ConnectivityAndInternetAccess

          Complete, unmodified vendored source from:
          https://gist.github.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f

          Pinned revision: ${GIST_REV}

          The compiled Android copy changes only its package declaration to com.example.muyinteresante.util.
          All connectivity, DNS, HTTP(S), VPN, captive-portal, network-observer and compatibility logic is retained.
          EOF

          cat > target/README.md <<EOF
          # ${APP_NAME}

          Independent Android RSS reader for ${MEDIA_NAME}.

          ## Features
          - Live RSS: ${FEED_URL}
          - RecyclerView list, search, pull-to-refresh, sharing and article view
          - Offline JSON and image cache
          - Passive network observation and explicit connectivity diagnostics
          - Complete ConnectivityAndInternetAccess gist vendored under third_party/connectivity
          - Android API 16+ and Java 8

          This is an independent reader and is not an official ${MEDIA_NAME} application.
          EOF

      - name: Compile Debug and Release APKs
        working-directory: target
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug assembleRelease

      - name: Commit completed app
        working-directory: target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Noticias elDiario.es Android RSS app"
          git push origin HEAD:main

      - name: Publish v1.0.0 release
        working-directory: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk noticias-eldiario-v1.0.0.apk
          gh release create v1.0.0 noticias-eldiario-v1.0.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "v1.0.0 - Noticias elDiario.es" \
            --notes "Primera versión funcional: lector RSS, búsqueda, caché offline, diagnóstico de red y gist completo ConnectivityAndInternetAccess integrado."
