name: Security hardening release

on:
  push:
    paths:
      - '.github/workflows/security-hardening-release.yml'

permissions:
  contents: write

jobs:
  harden-build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply security hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java_root = Path('app/src/main/java')
          xxe_insertions = 0
          print_replacements = 0
          block = '''\n{indent}try {{\n{indent}    dbf.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);\n{indent}    dbf.setFeature("http://xml.org/sax/features/external-general-entities", false);\n{indent}    dbf.setFeature("http://xml.org/sax/features/external-parameter-entities", false);\n{indent}}} catch (Exception e) {{\n{indent}    android.util.Log.w("XML_SEC", "El parser no soporta las configuraciones de seguridad XXE", e);\n{indent}}}'''

          for p in java_root.rglob('*.java'):
              s = p.read_text(encoding='utf-8')
              old = s
              n = s.count('e.printStackTrace();')
              if n:
                  s = s.replace('e.printStackTrace();', 'android.util.Log.e("SecurityLog", "Excepción capturada de forma segura", e);')
                  print_replacements += n

              if 'DocumentBuilderFactory' in s and 'http://apache.org/xml/features/disallow-doctype-decl' not in s:
                  marker = 'dbf.setCoalescing(true);'
                  if marker in s:
                      pos = s.index(marker)
                      line_start = s.rfind('\n', 0, pos) + 1
                      indent = s[line_start:pos]
                      end = pos + len(marker)
                      s = s[:end] + block.format(indent=indent) + s[end:]
                      xxe_insertions += 1

              if s != old:
                  p.write_text(s, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          m = manifest.read_text(encoding='utf-8')
          app_match = re.search(r'<application\b[^>]*>', m, flags=re.S)
          if not app_match:
              raise SystemExit('No se encontró <application> en AndroidManifest.xml')
          app_tag = app_match.group(0)
          if 'android:usesCleartextTraffic=' in app_tag:
              new_tag = re.sub(r'android:usesCleartextTraffic\s*=\s*"[^"]*"', 'android:usesCleartextTraffic="false"', app_tag)
          else:
              new_tag = app_tag.replace('<application', '<application\n        android:usesCleartextTraffic="false"', 1)
          m = m[:app_match.start()] + new_tag + m[app_match.end():]
          manifest.write_text(m, encoding='utf-8')

          gradle = Path('app/build.gradle')
          g = gradle.read_text(encoding='utf-8')
          code_match = re.search(r'versionCode\s+(\d+)', g)
          if not code_match:
              raise SystemExit('No se encontró versionCode')
          new_code = int(code_match.group(1)) + 1
          g = re.sub(r'versionCode\s+\d+', f'versionCode {new_code}', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "1.11.3"', g, count=1)
          gradle.write_text(g, encoding='utf-8')

          if xxe_insertions < 1:
              raise SystemExit('No se insertó ningún bastionado XXE')
          if print_replacements < 1:
              raise SystemExit('No se reemplazó ningún printStackTrace')
          leftovers = [str(p) for p in java_root.rglob('*.java') if 'e.printStackTrace();' in p.read_text(encoding='utf-8')]
          if leftovers:
              raise SystemExit('Quedan e.printStackTrace(): ' + ', '.join(leftovers))
          PY

          grep -R --include='*.java' -q 'disallow-doctype-decl' app/src/main/java
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          git diff --check

      - name: Commit and push security patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java app/src/main/AndroidManifest.xml app/build.gradle
          git commit -m "sec: bastionado XXE, eliminación de printStackTrace y bloqueo de tráfico HTTP en claro"
          echo "SEC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release_notes.md <<'EOF'
          - 🔒 Mitigación XXE: Se han deshabilitado las entidades externas (DTDs) en el parser XML para prevenir lectura de archivos locales.
          * 🔒 Information Leakage: Se ha eliminado printStackTrace() a favor del sistema de Logs cifrado de Android.
          * 🔒 Network Security: Se bloquea estrictamente cualquier tráfico HTTP no cifrado a nivel de Manifest (usesCleartextTraffic).
          EOF
          git tag v1.11.3 "$SEC_SHA"
          git push origin refs/tags/v1.11.3
          gh release create v1.11.3 --repo "$GITHUB_REPOSITORY" --target "$SEC_SHA" --title "Security Update: Prevención XXE y Endurecimiento de Red" --notes-file release_notes.md
          gh release upload v1.11.3 app/build/outputs/apk/release/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
          for b in sec-temp-unused sec-temp-unused-2 sec-temp-unused-3 sec-temp-unused-4 sec-temp-unused-5; do git push origin --delete "$b" || true; done
