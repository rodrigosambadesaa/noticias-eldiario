name: Build and upload timeout-fix APK

on:
  push:
    paths:
      - '.github/workflows/build-upload-timeout-apk.yml'

permissions:
  contents: write

jobs:
  build-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: a4b0888a1f1b566ed99de08f3f42866c316bdbe9
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk /tmp/app-release.apk
      - name: Retarget tag and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1.11.2 a4b0888a1f1b566ed99de08f3f42866c316bdbe9
          git push origin -f refs/tags/v1.11.2
          gh release edit v1.11.2 --repo "$GITHUB_REPOSITORY" --target a4b0888a1f1b566ed99de08f3f42866c316bdbe9
          gh release upload v1.11.2 /tmp/app-release.apk --repo "$GITHUB_REPOSITORY" --clobber
